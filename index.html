const PAGINATION_I18N={'zh-Hans':{pageFirst:'首页',pageLast:'尾页',pageJumpLabel:'跳转页码',pageJumpButton:'跳转'},'zh-Hant':{pageFirst:'首頁',pageLast:'末頁',pageJumpLabel:'跳轉頁碼',pageJumpButton:'跳轉'},en:{pageFirst:'First',pageLast:'Last',pageJumpLabel:'Page',pageJumpButton:'Go'},ja:{pageFirst:'最初',pageLast:'最後',pageJumpLabel:'ページ番号',pageJumpButton:'移動'},ko:{pageFirst:'첫 페이지',pageLast:'마지막',pageJumpLabel:'페이지 번호',pageJumpButton:'이동'}};Object.entries(PAGINATION_I18N).forEach(([k,v])=>Object.assign(I18N[k],v));function goToPage(target){const max=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));const n=Number(target);if(!Number.isSafeInteger(n)||n<1||n>max){$('pageJump').setCustomValidity('1–'+max);$('pageJump').reportValidity();return}$('pageJump').setCustomValidity('');page=n;render();$('archive').scrollIntoView({behavior:'smooth'})}
function applyLanguage(){document.documentElement.lang=lang;document.title=t('siteTitle');document.querySelector('meta[name="description"]').content=t('siteDescription');$('language').value=lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(e=>e.placeholder=t(e.dataset.placeholder));for(const [id,key] of [['smaller','smaller'],['larger','larger'],['closeReader','close'],['theme',night?'day':'night']]){$(id).setAttribute('aria-label',t(key));$(id).title=t(key)}$('previousLabel').textContent='← '+t('previous');$('nextLabel').textContent=t('next')+' →';const old=$('year').value;$('year').replaceChildren(new Option(t('allYears'),''));[...new Set(entries.map(yearOf).filter(Boolean))].sort().reverse().forEach(y=>$('year').add(new Option(y,y)));$('year').value=old;updateRegionOptions();render();renderFeatured();$('savedFilter').textContent=t(savedOnly?'allWorks':'savedWorks');if($('reader').open&&current>=0)openEntry(current,false)}
function render(){const q=norm($('q').value.trim()),y=$('year').value,p=$('place').value,tag=norm($('tag').value.trim());filtered=visibleEntries().filter((e,i)=>{if(savedOnly&&!savedIds.has(String(e.id)))return false;const original=entries[i]||e;return (!q||norm([e.title,textOf(e),original.title,emoji(original.content||original.text||'')].join(' ')).includes(q))&&(!y||yearOf(e)===y)&&(!p||(p==='__unmarked__'?!regionOf(original):regionOf(original)===p||regionOf(original).startsWith(p+'·')))&&(!tag||norm([flat(e.tags),flat(e.keywords),flat(original.tags),flat(original.keywords)].join(' ')).includes(tag))});page=Math.max(1,Math.min(page,Math.ceil(filtered.length/PAGE_SIZE)||1));$('resultCount').textContent=filtered.length;$('total').textContent=entries.length|| (loading?'—':'0');const root=$('results');root.replaceChildren();if(!filtered.length){const wrap=document.createElement('div');wrap.className='empty';const heading=document.createElement('h3'),p=document.createElement('p');heading.textContent=loading?t('loading'):loadError?t('error'):savedOnly?t('savedEmpty'):t('noResults');p.textContent=loading||loadError?'':t('tryAgain');wrap.append(heading,p);root.append(wrap)}for(const [offset,e] of filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE).entries()){const i=(page-1)*PAGE_SIZE+offset,a=document.createElement('article'),meta=document.createElement('div'),h=document.createElement('h3'),excerpt=document.createElement('div'),bottom=document.createElement('div'),button=document.createElement('button'),count=document.createElement('span');a.className='entry';meta.className='meta';meta.textContent=[e.date||yearOf(e),locationOf(e)].filter(Boolean).join(' / ')+' · '+t('editorialTitle');h.textContent=titleOf(e);excerpt.className='excerpt';excerpt.textContent=bodyText(e);button.className='read-button';button.type='button';button.textContent=t('read')+'  ↗';button.setAttribute('aria-label',t('read')+' · '+titleOf(e));button.addEventListener('click',()=>openEntry(i));count.className='word-count';count.textContent=textOf(e).replace(/\s/g,'').length+' '+t('chars');bottom.className='card-bottom';bottom.append(button,count);const credit=document.createElement('p');credit.className='entry-credit';credit.textContent=t('authorCredit')+' · '+t('editorialTitle');a.append(meta,h,credit,excerpt,bottom);root.append(a)}$('pageInfo').textContent=page+' / '+(Math.ceil(filtered.length/PAGE_SIZE)||1);$('pagePrevious').disabled=page<=1;$('pageFirst').disabled=page<=1;$('pageNext').disabled=page*PAGE_SIZE>=filtered.length;$('pageLast').disabled=page*PAGE_SIZE>=filtered.length;$('pageJump').max=String(Math.max(1,Math.ceil(filtered.length/PAGE_SIZE)));$('pageJump').value=String(page);$('pageJump').setCustomValidity('');document.querySelector('.pagination').hidden=filtered.length<=PAGE_SIZE}
function bodyText(e){let text=textOf(e).trim();const lines=text.split(/\r?\n/);if(lines.length>1&&norm(lines[0].trim())===norm(emoji(e.title||'').trim()))text=lines.slice(1).join('\n').trim();return text}
function openEntry(index,resetScroll=true){const e=filtered[index];if(!e)return;if(resetScroll)showChineseOriginal=false;current=index;syncBookmark();$('readerTitle').textContent=titleOf(e);$('readerKicker').textContent=t('authorCredit')+' · '+t('editorialTitle');const sourceEntry=entries.find(item=>item.id===e.id)||e;const translated=['en','ja','ko'].includes(lang)&&Boolean(bodyTranslations?.[e.id]);let text=bodyText(e);if(translated&&showChineseOriginal){text=emoji(sourceEntry.content||sourceEntry.text||'').trim();const lines=text.split(/\r?\n/);if(lines.length>1&&norm(lines[0].trim())===norm(emoji(sourceEntry.title||'').trim()))text=lines.slice(1).join('\n').trim();}$('bodyLanguageNote').textContent=translated&&!showChineseOriginal?t('machineTranslation'):t('original');$('toggleOriginal').hidden=!translated;$('toggleOriginal').textContent=t(showChineseOriginal?'showTranslation':'showOriginal');const meta=$('readerMeta');meta.replaceChildren();for(const value of [t('metadataNote'),e.date||yearOf(e),locationOf(e),text.replace(/\s/g,'').length+' '+t('chars'),t('readTime')+' '+Math.max(1,Math.ceil(text.length/450))+' '+t('minutes')]){if(value){const span=document.createElement('span');span.textContent=value;meta.append(span)}}const body=$('readerBody');body.replaceChildren();const lines=text.split(/\r?\n/).filter(l=>l.trim());const poetic=lines.length>=3&&lines.filter(l=>l.length<30).length/lines.length>.75;body.classList.toggle('poem',poetic);for(const part of (poetic?text.split(/\r?\n/):text.split(/\n\s*\n|\r?\n/)).filter(p=>p.trim())){const p=document.createElement('p');p.textContent=part;body.append(p)}body.lang=translated&&!showChineseOriginal?lang:lang==='zh-Hant'?'zh-Hant':'zh-Hans';$('previousEntry').disabled=index<=0;$('nextEntry').disabled=index>=filtered.length-1;$('previousTitle').textContent=index>0?titleOf(filtered[index-1]):'';$('nextTitle').textContent=index<filtered.length-1?titleOf(filtered[index+1]):'';$('readerPosition').textContent=(index+1)+' / '+filtered.length;if(!$('reader').open){$('reader').showModal();document.body.classList.add('reading')}if(resetScroll)$('readerScroll').scrollTop=0;updateProgress()}
function updateProgress(){const s=$('readerScroll'),range=s.scrollHeight-s.clientHeight;$('readProgress').style.width=(range<=1?100:Math.min(100,s.scrollTop/range*100))+'%'}
function applyPreferences(){$('reader').style.setProperty('--reading-size',readingSize+'px');$('reader').classList.toggle('night',night);$('smaller').disabled=readingSize<=18;$('larger').disabled=readingSize>=28;$('theme').setAttribute('aria-label',t(night?'day':'night'));$('theme').title=t(night?'day':'night');updateProgress()}

async function loadBodyTranslations(){if(bodyTranslations)return;if(!bodyTranslationPromise)bodyTranslationPromise=fetch('./data/translations.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(index=>{if(!index||!Array.isArray(index.languages)||index.languages.join(',')!=='en,ja,ko'||!index.translations||entries.some(e=>!Array.isArray(index.translations[e.id])||index.translations[e.id].length!==3||index.translations[e.id].some(text=>typeof text!=='string'||!text.trim()||/^(?:正在加载|正在載入|Loading data|#ERROR!|#N\/A)/i.test(text))))throw Error('Incomplete body translations');bodyTranslations=index.translations;bodyTranslationError=false}).catch(()=>{bodyTranslationError=true;bodyTranslationPromise=null});await bodyTranslationPromise;}
$('saveEntry').addEventListener('click',()=>{const e=filtered[current];if(!e)return;const id=String(e.id);if(savedIds.has(id))savedIds.delete(id);else savedIds.add(id);saveBookmarks();syncBookmark();if(savedOnly)render()});$('shareEntry').addEventListener('click',async()=>{const e=filtered[current];if(!e)return;const url=location.origin+location.pathname+'#work='+encodeURIComponent(e.id);try{await navigator.clipboard.writeText(url);$('shareEntry').title=t('linkCopied')}catch{prompt(t('share'),url)}});$('randomEntry').addEventListener('click',()=>{if(entries.length)openById(entries[Math.floor(Math.random()*entries.length)].id)});$('savedFilter').addEventListener('click',()=>{savedOnly=!savedOnly;page=1;$('savedFilter').textContent=t(savedOnly?'allWorks':'savedWorks');render()});window.addEventListener('hashchange',syncHash);$('toggleOriginal').addEventListener('click',()=>{showChineseOriginal=!showChineseOriginal;openEntry(current,false)});

async function loadTraditional(){if(traditional)return;if(!tradPromise)tradPromise=fetch('./data/entries.zh-Hant.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{if(!Array.isArray(d)||d.length!==entries.length||d.some((e,i)=>e.id!==entries[i].id))throw Error('Traditional data mismatch');traditional=d;tradError=false}).catch(()=>{tradError=true;tradPromise=null});await tradPromise}
$('language').addEventListener('change',async e=>{lang=e.target.value;showChineseOriginal=false;safeSet('archive-language',lang);if(['en','ja','ko'].includes(lang)&&!bodyTranslations){$('language').disabled=true;await loadBodyTranslations();$('language').disabled=false;if(bodyTranslationError){alert(t('translationError'));lang='zh-Hans';safeSet('archive-language',lang);}}if(lang==='zh-Hant'&&!traditional){$('language').disabled=true;await loadTraditional();$('language').disabled=false;if(tradError){lang='zh-Hans';safeSet('archive-language',lang);alert('繁體資料暫時無法讀取，請稍後重試。')}}applyLanguage()});
['q','year','place','tag'].forEach(id=>$(id).addEventListener('input',()=>{page=1;render()}));$('reset').addEventListener('click',()=>{['q','year','place','tag'].forEach(id=>$(id).value='');page=1;render()});for(const [id,delta] of [['pagePrevious',-1],['pageNext',1]])$(id).addEventListener('click',()=>goToPage(page+delta));$('pageFirst').addEventListener('click',()=>goToPage(1));$('pageLast').addEventListener('click',()=>goToPage(Math.ceil(filtered.length/PAGE_SIZE)));$('pageJump').addEventListener('input',()=>$('pageJump').setCustomValidity(''));$('pageJumpForm').addEventListener('submit',event=>{event.preventDefault();goToPage($('pageJump').value)});$('previousEntry').addEventListener('click',()=>openEntry(current-1));$('nextEntry').addEventListener('click',()=>openEntry(current+1));$('closeReader').addEventListener('click',()=>$('reader').close());$('reader').addEventListener('close',()=>document.body.classList.remove('reading'));$('reader').addEventListener('click',e=>{if(e.target===$('reader')){const r=$('reader').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('reader').close()}});$('readerScroll').addEventListener('scroll',updateProgress,{passive:true});for(const [id,delta] of [['smaller',-1],['larger',1]])$(id).addEventListener('click',()=>{readingSize=Math.min(28,Math.max(18,readingSize+delta));safeSet('archive-font',String(readingSize));applyPreferences()});$('theme').addEventListener('click',()=>{night=!night;safeSet('archive-night',night?'1':'0');applyPreferences()});window.addEventListener('resize',updateProgress);
applyLanguage();applyPreferences();
Promise.all(['./data/entries.json','./data/titles.json'].map(url=>fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}))).then(async ([d,titleIndex])=>{if(!Array.isArray(d))throw Error('Invalid collection');if(!titleIndex||!titleIndex.titles||!Array.isArray(titleIndex.languages)||titleIndex.languages.join(',')!=='zh-Hans,zh-Hant,en,ja,ko'||d.some(e=>!Array.isArray(titleIndex.titles[e.id])||titleIndex.titles[e.id].length!==5))throw Error('Invalid title index');editorialTitles=titleIndex.titles;entries=d;loading=false;if(['en','ja','ko'].includes(lang)){await loadBodyTranslations();if(bodyTranslationError){lang='zh-Hans';safeSet('archive-language',lang)}}if(lang==='zh-Hant'){await loadTraditional();if(tradError){lang='zh-Hans';safeSet('archive-language',lang)}}applyLanguage();syncHash()}).catch(()=>{loading=false;loadError=true;render()});
</script></body></html>
