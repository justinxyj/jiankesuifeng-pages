<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="剑客随风文集：资料来源、编者拟定标题、语言版本与整理原则。"><title>关于文集 | 剑客随风</title><style>:root{--paper:#fffefb;--bg:#f4f1e9;--ink:#24382f;--muted:#68756c;--line:#dcded3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 system-ui,-apple-system,"PingFang SC",sans-serif}a{color:inherit;text-decoration:none}a:focus-visible,select:focus-visible{outline:2px solid #9a653b;outline-offset:4px}.top{border-bottom:1px solid var(--line);background:var(--paper)}.nav{max-width:1120px;padding:20px clamp(24px,5vw,48px);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.brand{font-family:Georgia,"Songti SC",serif;font-size:21px}.tools{display:flex;gap:18px;align-items:center;font-size:14px}select{border:1px solid var(--line);border-radius:20px;background:white;padding:9px 12px;max-width:145px}.wrap{max-width:840px;margin:0 auto;padding:clamp(44px,7vw,88px) clamp(24px,6vw,56px) 100px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#9a653b}h1{font:500 clamp(35px,5vw,56px)/1.3 Georgia,"Songti SC","Yu Mincho",serif;margin:14px 0 30px}.lead{color:var(--muted);font-size:15px;border-bottom:1px solid var(--line);padding-bottom:30px}section{margin:48px 0}h2{font:500 clamp(22px,3vw,28px)/1.4 Georgia,"Songti SC","Yu Mincho",serif;margin-bottom:20px}p{margin:0 0 17px;color:#343d36;overflow-wrap:anywhere}section p:first-of-type{font-weight:450}.end{border-top:1px solid var(--line);padding-top:24px;color:var(--muted);font-size:13px}@media(max-width:600px){.nav{padding:16px 24px}.tools{gap:12px}.wrap{padding-top:42px}section{margin:36px 0}body{font-size:15px;line-height:1.85}}</style></head><body><header class="top"><nav class="nav"><a class="brand" href="/jiankesuifeng-pages/" id="brand">剑客随风</a><div class="tools"><a href="/jiankesuifeng-pages/" id="back">返回作品目录</a><select id="language" aria-label="Language"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div></nav></header><main class="wrap"><div class="eyebrow">ABOUT THE ARCHIVE</div><h1 id="heading">关于文集</h1><p class="lead" id="lead"></p><div id="content"></div><footer class="end" id="foot"></footer></main><script>const DATA={"zh-Hans":[["编者说明","《剑客随风文集》是以“剑客随风”名义发表的个人文字资料整理项目，主要收录作者在不同时期通过微信朋友圈发布的随笔、生活记录及个人感想。|这些文字原本以社交平台动态的形式独立发表，内容涉及日常生活、人物交往、地方见闻、个人经历及对社会现象的观察等。原始记录通常没有独立标题，也未按照统一的主题或章节结构编排。|本项目以保存和整理原始文字为主要目的，通过时间排序、地域分类、关键词索引及全文检索等方式，为读者提供查阅和阅读渠道。"],["资料来源与整理方式","文集以能够获取的原始朋友圈记录为基础，对相关文字进行收集、录入、核对与分类。|保留原文：以作者发表时的中文文字为基础，原则上不对原文内容进行改写、扩写或重新创作。|时间整理：依据原始记录中可核实的发表时间建立时间索引。无法确认的日期不作为确定事实标注。|地域分类：结合原文内容及相关信息设置地域标签。地域可能指事件发生地、文字描述对象或发表地点，具体含义以可核实的信息为准。|内容索引：根据文字涉及的主题、人物、地点及关键词建立检索分类。相关分类属于编者整理信息，不代表作者原有的分类方式。|保留历史语境：原文中涉及的观点、称谓及表达方式，原则上按照发表时的文字保留，不以整理时的认识替代作者原有表述。"],["关于文章标题","文集中各篇文章的标题均由编者根据原文内容拟定，并非作者发表时使用的原标题。|原始朋友圈记录通常没有独立标题。为便于建立文章目录、分类索引及搜索结果，编者依据每篇文字的主要内容、事件、地点或具有代表性的表达拟定标题。|编者拟定的标题仅用于资料整理与阅读导航，不应视为作者本人对文章的命名，也不代表作者对标题的确认。"],["关于语言版本","文集提供简体中文、繁体中文、英语、日语和韩语五种语言的阅读界面及正文版本。|简体中文原文作为内容核对的基础。其他语言版本由编者根据中文原文翻译整理，旨在方便不同语言的读者理解文字内容。|翻译过程中尽可能保留原文的事实信息、语义及表达特点。由于语言结构和文化语境存在差异，译文与原文之间可能存在表达上的区别。如需准确引用作者的原始表述，应以中文原文为准。|各语言版本中的文章标题同样属于编者拟定标题的对应翻译，不属于作者原始文字。"],["关于资料完整性","本项目属于持续整理的个人文字档案，并不意味着已经收录作者在相关时期发表的全部文字。|受原始资料保存情况、记录完整程度及核实条件等因素影响，部分文章可能存在日期不详、地域信息缺失或相关背景资料不足的情况。|对于无法确认的信息，原则上不作推测性补充。后续如发现新的原始资料或核实出已有记录的错误，可对相应条目进行补充或修正。"],["关于作者与编者","作者：剑客随风。文集中收录的原始文字，其内容及观点归属于作者本人。|编者：文集整理者。编者负责资料收集、文字录入、标题拟定、时间与地域标注、分类索引、语言翻译及网站维护等工作。|编者所添加的标题、标签、译文及其他辅助信息均属于整理成果，应与作者原始文字加以区分。|本项目不对作者的个人经历、思想观点或文字价值作统一评价，也不将编者的解释作为作者本人的表述。"]],"zh-Hant":[["編者说明","《剑客随风文集》是以“剑客随风”名义发表的个人文字资料整理项目，主要收录作者在不同时期通过微信朋友圈发布的随笔、生活记录及个人感想。|这些文字原本以社交平台动态的形式独立发表，内容涉及日常生活、人物交往、地方见闻、个人经历及对社会现象的观察等。原始记录通常没有独立标题，也未按照统一的主题或章节结构编排。|本项目以保存和整理原始文字为主要目的，通过时间排序、地域分类、关键词索引及全文检索等方式，为读者提供查阅和阅读渠道。"],["資料來源與整理方式","文集以能够获取的原始朋友圈记录为基础，对相关文字进行收集、录入、核对与分类。|保留原文：以作者发表时的中文文字为基础，原则上不对原文内容进行改写、扩写或重新创作。|时间整理：依据原始记录中可核实的发表时间建立时间索引。无法确认的日期不作为确定事实标注。|地域分类：结合原文内容及相关信息设置地域标签。地域可能指事件发生地、文字描述对象或发表地点，具体含义以可核实的信息为准。|内容索引：根据文字涉及的主题、人物、地点及关键词建立检索分类。相关分类属于编者整理信息，不代表作者原有的分类方式。|保留历史语境：原文中涉及的观点、称谓及表达方式，原则上按照发表时的文字保留，不以整理时的认识替代作者原有表述。"],["關于文章標題","文集中各篇文章的标题均由编者根据原文内容拟定，并非作者发表时使用的原标题。|原始朋友圈记录通常没有独立标题。为便于建立文章目录、分类索引及搜索结果，编者依据每篇文字的主要内容、事件、地点或具有代表性的表达拟定标题。|编者拟定的标题仅用于资料整理与阅读导航，不应视为作者本人对文章的命名，也不代表作者对标题的确认。"],["關于語言版本","文集提供简体中文、繁体中文、英语、日语和韩语五种语言的阅读界面及正文版本。|简体中文原文作为内容核对的基础。其他语言版本由编者根据中文原文翻译整理，旨在方便不同语言的读者理解文字内容。|翻译过程中尽可能保留原文的事实信息、语义及表达特点。由于语言结构和文化语境存在差异，译文与原文之间可能存在表达上的区别。如需准确引用作者的原始表述，应以中文原文为准。|各语言版本中的文章标题同样属于编者拟定标题的对应翻译，不属于作者原始文字。"],["關于資料完整性","本项目属于持续整理的个人文字档案，并不意味着已经收录作者在相关时期发表的全部文字。|受原始资料保存情况、记录完整程度及核实条件等因素影响，部分文章可能存在日期不详、地域信息缺失或相关背景资料不足的情况。|对于无法确认的信息，原则上不作推测性补充。后续如发现新的原始资料或核实出已有记录的错误，可对相应条目进行补充或修正。"],["關于作者與編者","作者：剑客随风。文集中收录的原始文字，其内容及观点归属于作者本人。|编者：文集整理者。编者负责资料收集、文字录入、标题拟定、时间与地域标注、分类索引、语言翻译及网站维护等工作。|编者所添加的标题、标签、译文及其他辅助信息均属于整理成果，应与作者原始文字加以区分。|本项目不对作者的个人经历、思想观点或文字价值作统一评价，也不将编者的解释作为作者本人的表述。"]],"en":[["Editorial Note","Collected Writings of Swordsman in the Wind is an archival project for personal texts published under the pen name Swordsman in the Wind, primarily including essays, everyday observations and reflections posted on WeChat Moments at different times.|These texts were originally published as separate social-media posts, covering daily life, personal interactions, local observations, experiences and social commentary. The original posts generally had no separate titles or consistent chapter structure.|The project preserves and organizes available texts, providing chronological browsing, geographic categories, keyword indexing and full-text search."],["Sources and Editorial Method","The collection is based on available original WeChat Moments records, which are gathered, transcribed, checked and categorized.|Original wording: Chinese texts are preserved in principle, without rewriting, expanding or recreating their content.|Dates: chronological indexes use publication dates that can be verified from original records; uncertain dates are not presented as established facts.|Places: geographic labels may refer to the event location, subject of a text or place of publication, depending on verifiable evidence.|Indexes: subjects, people, places and keywords are editorial classifications, not categories originally assigned by the author.|Historical context: views, names and expressions are generally retained as published, rather than updated to reflect later interpretations."],["Article Titles","All article titles in this collection were supplied by the editor based on the content. They are not original titles used by the author.|The original WeChat Moments posts generally lacked separate titles. For navigation, indexing and search, the editor assigned descriptive titles based on content, events, places or representative expressions.|These titles are editorial aids only. They should not be attributed to the author or treated as author-approved."],["Language Versions","The collection offers complete reading interfaces and text versions in Simplified Chinese, Traditional Chinese, English, Japanese and Korean.|The original Simplified Chinese text is the reference for verification. Other language versions are editorial translations intended to facilitate access.|Translations seek to preserve factual meaning and expression, but linguistic and cultural differences may affect phrasing. Quotations of the author's exact words should be checked against the Chinese original.|Translated titles are translations of editor-supplied titles, not titles originally written by the author."],["Completeness of the Archive","This is an ongoing personal-text archive and does not claim to contain everything published by the author during the periods covered.|Some records may lack dates, geographic information or contextual documentation because of limitations in surviving source material.|Unverified information is not filled in by speculation. Entries may be supplemented or corrected when additional source records become available."],["Author and Editor","Author: Swordsman in the Wind. The original writings and the views they express are attributable to the author.|Editor: the collection's compiler, responsible for gathering, transcribing, assigning titles, recording dates and places, indexing, translating and maintaining the website.|Titles, labels, translations and supporting notes added by the editor are editorial materials distinct from the author's original words.|The project does not provide a definitive assessment of the author's life, views or literary merit, nor present editorial interpretations as the author's own statements."]],"ja":[["編者による説明","『風に随う剣客 文集』は、筆名「風に随う剣客」で発表された個人の文章を整理する資料保存プロジェクトです。主に異なる時期にWeChatのモーメンツへ投稿された随筆、生活記録、感想を収録しています。|文章はもともと独立したSNS投稿として発表され、日常生活、人との交流、地域の見聞、個人的経験、社会現象への考察などを含みます。通常、原投稿に独立した題名や統一的な章立てはありませんでした。|本プロジェクトは原文の保存と整理を目的とし、年代順、地域別、キーワード索引、全文検索による閲覧手段を提供します。"],["資料の出典と整理方針","入手可能なWeChatモーメンツの原記録をもとに、収集、入力、照合、分類を行っています。|原文の保持：中国語の原文を基本とし、原則として改作、加筆、再創作は行いません。|日時：確認できる投稿日時に基づいて整理し、不確かな日付を確定情報として示しません。|地域：地域ラベルは出来事の場所、文章の対象、投稿場所などを指す場合があり、確認可能な情報に従います。|索引：主題、人物、場所、キーワードの分類は編者によるもので、著者が設けた分類ではありません。|当時の文脈：意見、呼称、表現は原則として発表当時の形を保持し、後年の解釈に置き換えません。"],["作品の題名について","本サイトの各作品の題名は本文に基づき編者が付けたもので、著者が投稿時に使用した原題ではありません。|原投稿には通常、独立した題名がありません。目次、分類、検索のため、内容、出来事、場所、特徴的な表現を参考に題名を付けています。|題名は資料整理と閲覧の補助情報であり、著者による命名や承認を意味しません。"],["言語版について","簡体字中国語、繁体字中国語、英語、日本語、韓国語の五つの言語で画面と本文を提供します。|内容確認の基準は簡体字中国語の原文です。他言語版は理解を助けるための編者による翻訳です。|翻訳では事実関係、意味、表現の保持に努めますが、言語や文化の違いによって表現が異なる場合があります。正確な引用には中国語原文を参照してください。|各言語の題名も編者が付けた題名の翻訳であり、著者の原題ではありません。"],["資料の網羅性について","本プロジェクトは継続的に整理する個人文章のアーカイブであり、対象期間の全投稿を収録したものではありません。|原資料の保存状態や確認の制約により、日時、地域、背景情報が不明な作品もあります。|確認できない情報を推測で補うことはせず、新たな資料が見つかった場合には追記・訂正することがあります。"],["著者と編者","著者：風に随う剣客。原文の内容と意見は著者に帰属します。|編者：文集整理者。資料収集、入力、題名の付与、日時と地域の表示、索引、翻訳、サイト管理を担当します。|編者が追加した題名、ラベル、訳文、補足情報は著者の原文とは区別されます。|本プロジェクトは著者の経歴、思想、作品価値について一律の評価を行わず、編者の解釈を著者自身の発言として扱いません。"]],"ko":[["편집자 설명","『바람을 따르는 검객 문집』은 ‘바람을 따르는 검객’이라는 필명으로 발표된 개인 글을 정리하는 기록 보존 프로젝트입니다. 주로 여러 시기에 위챗 모멘트에 게시한 수필, 생활 기록과 감상을 수록합니다.|이 글들은 원래 각각의 소셜미디어 게시물로 발표되었으며 일상생활, 인간관계, 지역의 견문, 개인 경험과 사회 현상에 대한 관찰 등을 다룹니다. 원본 게시물에는 일반적으로 별도의 제목이나 통일된 장 구성이 없었습니다.|이 프로젝트는 원문을 보존하고 정리하기 위해 연대순, 지역별 분류, 키워드 색인과 전문 검색 기능을 제공합니다."],["자료 출처 및 정리 방식","확보할 수 있는 위챗 모멘트 원본 기록을 바탕으로 수집, 입력, 대조 및 분류합니다.|원문 보존: 중국어 원문을 기준으로 하며 원칙적으로 내용을 개작하거나 추가하거나 다시 창작하지 않습니다.|날짜: 확인 가능한 게시 시각을 기준으로 색인을 만들며 확인되지 않은 날짜는 확정 사실로 표시하지 않습니다.|지역: 지역 표기는 사건 발생지, 글에서 다루는 장소 또는 게시 장소를 의미할 수 있으며 확인 가능한 자료를 따릅니다.|색인: 주제, 인물, 장소와 키워드 분류는 편집자가 추가한 것으로 저자의 원래 분류가 아닙니다.|역사적 맥락: 원문의 견해, 호칭과 표현은 원칙적으로 게시 당시의 형태를 유지하며 후대의 해석으로 대체하지 않습니다."],["글 제목에 관하여","문집의 모든 글 제목은 편집자가 본문에 따라 붙인 것으로 저자가 원래 게시할 때 사용한 제목이 아닙니다.|원래 위챗 모멘트 게시물에는 일반적으로 독립된 제목이 없었습니다. 목차와 검색을 위해 내용, 사건, 장소 또는 특징적인 표현을 참고하여 제목을 작성했습니다.|이 제목은 자료 정리와 탐색을 위한 보조 정보이며 저자의 명명이나 승인을 의미하지 않습니다."],["언어별 버전","간체 중국어, 번체 중국어, 영어, 일본어, 한국어의 다섯 가지 언어로 화면과 본문을 제공합니다.|내용 확인의 기준은 간체 중국어 원문입니다. 다른 언어의 본문은 독자의 이해를 돕기 위해 편집자가 번역했습니다.|번역은 사실, 의미와 표현을 유지하려 하지만 언어와 문화적 차이로 표현이 달라질 수 있습니다. 저자의 정확한 발언을 인용할 때는 중국어 원문을 확인해야 합니다.|각 언어의 제목 역시 편집자가 붙인 제목의 번역이며 저자가 작성한 원래 제목이 아닙니다."],["자료의 완전성","이 프로젝트는 계속 정리되는 개인 글 기록으로 해당 기간 저자의 모든 게시물을 수록했다고 주장하지 않습니다.|원본 자료의 보존 상태와 확인 조건에 따라 일부 글의 날짜, 지역 또는 배경 정보가 누락될 수 있습니다.|확인되지 않은 내용을 추측으로 채우지 않으며 새로운 원본이 발견되면 항목을 보완하거나 수정할 수 있습니다."],["저자와 편집자","저자: 바람을 따르는 검객. 원문과 그 안의 견해는 저자에게 귀속됩니다.|편집자: 문집 정리자. 자료 수집, 입력, 제목 작성, 날짜와 지역 표시, 색인, 번역과 사이트 관리를 담당합니다.|편집자가 추가한 제목, 표기, 번역과 보충 정보는 저자의 원문과 구분됩니다.|이 프로젝트는 저자의 생애, 견해 또는 문학적 가치를 일률적으로 평가하지 않으며 편집자의 해석을 저자의 발언으로 제시하지 않습니다."]]};const UI={"zh-Hans":["关于文集","返回作品目录","关于资料来源、编者拟题、翻译与档案整理原则。","《剑客随风文集》编者说明。本说明适用于全部语言版本。","剑客随风"],"zh-Hant":["關於文集","返回作品目錄","關於資料來源、編者擬題、翻譯與檔案整理原則。","《劍客隨風文集》編者說明。本說明適用於全部語言版本。","劍客隨風"],"en":["About the Collection","Back to collection","Sources, editor-supplied titles, translations and archival practices.","Editorial note for the collection. This note applies to all language versions.","Swordsman in the Wind"],"ja":["文集について","作品一覧へ","資料の出典、編者による題名、翻訳および整理方針について。","文集の編者による説明。すべての言語版に適用されます。","風に随う剣客"],"ko":["문집 소개","작품 목록으로","자료 출처, 편집자가 붙인 제목, 번역 및 기록 정리 원칙.","문집 편집자 설명. 모든 언어 버전에 적용됩니다.","바람을 따르는 검객"]};const $=id=>document.getElementById(id);function render(){let l=$('language').value;try{localStorage.setItem('archive-language',l)}catch(e){}document.documentElement.lang=l;const u=UI[l];document.title=u[0]+' | '+u[4];document.querySelector('meta[name="description"]').content=u[2];$('brand').textContent=u[4];$('back').textContent=u[1];$('heading').textContent=u[0];$('lead').textContent=u[2];$('foot').textContent=u[3];$('content').replaceChildren();for(const [title,paragraphs] of DATA[l]){const sec=document.createElement('section'),h=document.createElement('h2');h.textContent=title;sec.append(h);for(const text of paragraphs.split('|')){const p=document.createElement('p');p.textContent=text;sec.append(p)}$('content').append(sec)}}try{const l=localStorage.getItem('archive-language');if(DATA[l])$('language').value=l}catch(e){}$('language').addEventListener('change',render);render();</script></body></html>
